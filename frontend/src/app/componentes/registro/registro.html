<div class="registro-container">
  <div class="registro-card">
    <h2>Crear Cuenta - EduComparte</h2>
    <p class="subtitulo">Únete a la comunidad de universitarios de Huancayo</p>

    <form (ngSubmit)="registrarUsuario()">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          [value]="nombre()"
          (input)="actualizarNombre($event)"
          placeholder="Ej: Juan Pérez"
          required
        />
      </div>

      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          [value]="correo()"
          (input)="actualizarCorreo($event)"
          placeholder="ejemplo@uncp.edu.pe"
          required
        />
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña</label>
        <input
          type="password"
          id="contrasena"
          [value]="contrasena()"
          (input)="actualizarContrasena($event)"
          placeholder="Mínimo 8 caracteres"
          required
        />
      </div>

      <div class="form-group">
        <label for="universidad">Universidad</label>
        <select
          id="universidad"
          [value]="universidad()"
          (change)="actualizarUniversidad($event)"
          required
        >
          <option value="" disabled>Selecciona tu universidad</option>
          @for (uni of universidades(); track uni) {
            <option [value]="uni">{{ uni }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="rol">Rol</label>
        <select
          id="rol"
          [value]="rol()"
          (change)="actualizarRol($event)"
        >
          <option value="estudiante">Estudiante</option>
          <option value="docente">Docente</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" [disabled]="cargando()">
        {{ cargando() ? 'Registrando...' : 'Crear Cuenta' }}
      </button>
    </form>

    <p class="enlace-login">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
